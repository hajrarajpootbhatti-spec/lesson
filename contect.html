<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SpeakUp English</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="contect.css">

</head>

<body>
  <!-- =========================
       NAVBAR
  ========================== -->

  <nav class="navbar navbar-expand-lg bg-light">

    <div class="container-fluid">

      <!-- Website Name -->
       <a class="navbar-brand" href="index.html">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>SpeakUp English</span>
      </a>

      <!-- Mobile Menu Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

      </button>


      <!-- Navbar Content -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <!-- Home -->
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">
              Home
            </a>
          </li>


          <!-- About -->
          <li class="nav-item">
            <a class="nav-link" href="about.html">
              About
            </a>
          </li>


          <!-- Courses Dropdown -->
          <li class="nav-item dropdown">

            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

              Courses

            </a>


            <ul class="dropdown-menu">

              <li>
                <a class="dropdown-item" href="basic-english.html">
                  Basic English
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="grammar.html">
                  English Grammar
                </a>
              </li>

              <li>
                <hr class="dropdown-divider">
              </li>

              <li>
                <a class="dropdown-item" href="spoken-english.html">
                  Spoken English
                </a>
              </li>

            </ul>

          </li>


          <!-- Contact -->
          <li class="nav-item">
            <a class="nav-link" href="contect.html">
              Contact
            </a>
          </li>

        </ul>


        <!-- Search -->
        <form class="d-flex" role="search">

          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">

          <button class="btn btn-outline-success" type="submit">

            Search

          </button>

        </form>

        <a href="registration.html" class="btn btn-primary ms-2">
          Register Now
        </a>

      </div>

    </div>

  </nav>



  <!-- Contact Section -->

  <div class="container text-center mt-5" id="contact">

    <h2 class="display-6 fw-bold">
      Contact Us
    </h2>

    <p class="text-muted">
      Have a question? Send us a message.
    </p>

  </div>

  <div class="container mt-4">

    <form>

      <!-- Name -->
      <div class="mb-3">

        <label for="name" class="form-label">
          Your Name
        </label>

        <input type="text" class="form-control" id="name" placeholder="Enter your name">

      </div>


      <!-- Email -->
      <div class="mb-3">

        <label for="email" class="form-label">
          Email Address
        </label>

        <input type="email" class="form-control" id="email" placeholder="Enter your email">

      </div>

      <!-- Course -->

      <div class="mb-3">

        <label for="course" class="form-label">
          Select Course
        </label>

        <select class="form-select" id="course">

          <option selected>Choose a course</option>
          <option>Basic English</option>
          <option>English Grammar</option>
          <option>Spoken English</option>

        </select>

      </div>


      <!-- Message -->
      <div class="mb-3">

        <label for="message" class="form-label">
          Your Message
        </label>

        <textarea class="form-control" id="message" rows="4" placeholder="Write your message">
      </textarea>

      </div>


      <!-- Button -->
      <button type="submit" class="btn btn-primary">

        Send Message

      </button>

    </form>

  </div>

  <!-- Footer -->

  <footer class="bg-dark text-white text-center py-4 mt-5">

    <h5>SpeakUp English</h5>

    <p class="mb-1">
      Learn English. Build Confidence. Speak Fluently.
    </p>

    <p class="mb-0">
      © 2026 SpeakUp English. All Rights Reserved.
    </p>

  </footer>







  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"

    </script>

</body>

</html>
